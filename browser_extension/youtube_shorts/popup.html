<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>{{TITLE}}</title>
		<style>
			:root { color-scheme: light dark; }
			body { font: 14px sans-serif; width: 270px; margin: 0; padding: 12px 14px; }
			h1 { font-size: 15px; margin: 0 0 10px; }
			label { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
			.row { display: flex; gap: 8px; margin-top: 10px; }
			button { flex: 1; padding: 6px 8px; cursor: pointer; }
			#allow { display: none; margin: 0 0 10px; padding: 8px; background: #fff3c4; color: #5c4400; border-radius: 4px; }
			#allow button { margin-top: 6px; width: 100%; }
			#note { margin-top: 8px; min-height: 1em; opacity: 0.7; font-size: 12px; }
		</style>
	</head>
	<body>
		<h1>{{TITLE}}</h1>
		<div id="allow">The extension is not allowed on YouTube yet.<button id="allow-button">Allow on YouTube</button></div>
		<label><input type="checkbox" id="redirect"> Open Shorts as full videos</label>
		<label><input type="checkbox" id="save"> Save button</label>
		<label><input type="checkbox" id="download"> Download button</label>
		<div class="row"><button id="saved">Saved shorts and more...</button></div>
		<div id="note"></div>
		<script src="popup.js"></script>
	</body>
</html>
