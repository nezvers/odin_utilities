<!DOCTYPE html>
<html lang="en" style="height: 100%;">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{{TITLE}}</title>
		<link rel="preload" href="main.wasm" as="fetch" type="application/wasm" crossorigin="anonymous">
	</head>
	<body id="body" style="height: 100%; padding: 0; margin: 0; overflow: hidden; background-color: black;">
		<!-- tabindex lets the canvas take the keyboard focus, touch-action keeps the browser from scrolling or zooming on touches -->
		<canvas id="webgl-canvas" tabindex="0" style="touch-action: none; outline: none;" oncontextmenu="return false;" onmousedown="event.target.focus()"></canvas>
{{SCRIPTS}}
		<script type="text/javascript" src="odin.js"></script>
		<script type="text/javascript">
			// Keys that the browser would use for scrolling or focus, taken away from it while the canvas has the focus
			const keysForTheGame = new Set([" ", "Tab", "Backspace", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "PageUp", "PageDown", "Home", "End"]);
			const keyboardCanvas = document.getElementById("webgl-canvas");
			window.addEventListener("keydown", (ev) => {
				if (document.activeElement === keyboardCanvas && !ev.ctrlKey && !ev.metaKey && !ev.altKey && keysForTheGame.has(ev.key)) {
					ev.preventDefault();
				}
			});

			async function run() {
				const wasmMemoryInterface = new odin.WasmMemoryInterface();
				wasmMemoryInterface.setIntSize(4);

				let imports = odin.setupDefaultImports(wasmMemoryInterface, null, wasmMemoryInterface.memory);
				imports = { ...imports, ...({{IMPORTS}}) };

				const response = await fetch("main.wasm");
				const file = await response.arrayBuffer();
				const wasm = await WebAssembly.instantiate(file, imports);
				const exports = wasm.instance.exports;
				wasmMemoryInterface.setExports(exports);

				if (exports.memory) {
					wasmMemoryInterface.setMemory(exports.memory);
					{{START}}
				}

				if (exports._start) {
					exports._start();
				}

				// the generated entry exports step and shutdown, step runs once per frame until it returns false
				if (exports.step) {
					const odin_ctx = exports.default_context_ptr();

					let prevTimeStamp = undefined;
					function step(currTimeStamp) {
						if (prevTimeStamp == undefined) {
							prevTimeStamp = currTimeStamp;
						}

						const dt = (currTimeStamp - prevTimeStamp) * 0.001;
						prevTimeStamp = currTimeStamp;

						if (!exports.step(dt, odin_ctx)) {
							if (exports.shutdown) {
								exports.shutdown(dt, odin_ctx);
							}
							if (exports._end) {
								exports._end();
							}
							return;
						}

						window.requestAnimationFrame(step);
					}

					window.requestAnimationFrame(step);
				}
			}

			run();
		</script>
	</body>
</html>
